name: Relatar bug
description: Reporte um comportamento incorreto em acervo-de-trabalhos
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL afetada
      placeholder: https://acervo-de-trabalhos-guuxt1ve7-slydtx.vercel.app
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      render: shell
