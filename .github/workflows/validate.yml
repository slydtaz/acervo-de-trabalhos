name: Validate

on:
  push:
  pull_request:

jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify snapshot provenance
        run: |
          test -f docs/DEPLOY_HISTORY.md
          test -f docs/WIKI.md
          test -f snapshot/README.md
          grep -q "Snapshot only" snapshot/README.md
      - name: Verify issue templates
        run: test -f .github/ISSUE_TEMPLATE/bug_report.yml
